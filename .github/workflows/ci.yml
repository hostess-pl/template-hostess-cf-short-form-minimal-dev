name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # static-media-assets.json is gitignored; generate before astro check
      - name: Generate static media manifest
        run: node scripts/generate-static-assets-manifest.mjs

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          SITE_URL: https://hostess-template.workers.dev
